<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <rect x="40" y="40" width="720" height="420" fill="#0d0d0d" stroke="#000" stroke-width="4" rx="12"/>
  <text x="60" y="90" font-family="JetBrains Mono,monospace" font-size="14" fill="#1DD1A1">$ sentinel analyze ./src</text>
  <text x="60" y="120" font-family="JetBrains Mono,monospace" font-size="14" fill="#888">Scanning API contracts...</text>
  <text x="60" y="160" font-family="JetBrains Mono,monospace" font-size="14" fill="#1DD1A1"> GET /api/users  match</text>
  <text x="60" y="190" font-family="JetBrains Mono,monospace" font-size="14" fill="#1DD1A1"> POST /api/auth  match</text>
  <text x="60" y="220" font-family="JetBrains Mono,monospace" font-size="14" fill="#FF6B6B"> PATCH /api/users/:id  mismatch</text>
  <text x="60" y="250" font-family="JetBrains Mono,monospace" font-size="13" fill="#FF9F43">  expected: { name: string }</text>
  <text x="60" y="275" font-family="JetBrains Mono,monospace" font-size="13" fill="#FF9F43">  found:    { username: string }</text>
  <text x="60" y="320" font-family="JetBrains Mono,monospace" font-size="14" fill="#FECA57">1 mismatch found. Fix before deploy.</text>
</svg>
